# Dependabot — veilige, voorspelbare updates voor savoirfrance.
#
# Doel: stabiliteit. Kleine updates (patch + minor) komen wekelijks
# gebundeld in één PR. Security-fixes blijven gewoon binnenkomen.
# Grote (major) upgrades van de kern-frameworks worden NIET automatisch
# voorgesteld — die doen we alleen bewust, als project.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      safe-updates:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
